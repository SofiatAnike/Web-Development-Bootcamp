<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tables</title>
</head>
<body>
    <h1>List of Countries</h1>
    <table>
        <thead>
            <tr>
                <th>City</th>
                <th>Country</th>
                <th>Area</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
            
                <td>Tokyo</td>
                <td>Japan</td>
                <td>2191</td>
            </tr>
            
            <tr>
                <td>Delhi</td>
            <td>India</td>
            <td>1484</td>
            </tr>
            
            <tr>
                <td>Shanghai</td>
                <td>China</td>
                <td>6341</td>
            </tr>
        </tbody>
        
    </table>

    <h2>V2</h2>
    <table>
        <thead>
            <tr>
                <th rowspan="2">City</th>
                <th rowspan="2">Country</th>
                <th colspan="2">City Proper</th>
                
            </tr>
            <tr>
                <th>Area</th>
                <th>Density</th>
            </tr>
        </thead>
        
        <tbody>
            <tr>
            
                <td>Tokyo</td>
                <td>Japan</td>
                <td>2191</td>
                <td>6169</td>
            </tr>
            
            <tr>
                <td>Delhi</td>
                <td>India</td>
                <td>1484</td>
                <td>11289</td>
            </tr>
            
            <tr>
                <td>Shanghai</td>
                <td>China</td>
                <td>6341</td>
                <td>3922</td>
            </tr>
        </tbody>
        
    </table>
    
</body>
</html>
